name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: File size guard (no ts file over 2800 lines)
        run: |
          violations=$(find src test -name '*.ts' \
            -exec sh -c 'lines=$(wc -l < "$1"); if [ "$lines" -gt 2800 ]; then echo "$1: $lines lines"; fi' _ {} \;)
          if [ -n "$violations" ]; then echo "$violations"; exit 1; fi

      - run: npm run typecheck

      - run: npm test

      # Floor 80: measured line coverage on src/ is 98.61% (c8, 1637/1660) —
      # pinned generously below the measurement so the ratchet only fails on
      # real regressions.
      - name: Coverage ratchet (src/ >= 80%)
        run: |
          npm run coverage
          python3 - <<'EOF'
          import sys
          total = hit = 0
          in_src = False
          for line in open('coverage/lcov.info'):
              if line.startswith('SF:'):
                  in_src = '/src/' in line[3:] or line[3:].startswith('src/')
              elif in_src and line.startswith('LF:'):
                  total += int(line.split(':')[1])
              elif in_src and line.startswith('LH:'):
                  hit += int(line.split(':')[1])
          pct = 100.0 * hit / total if total else 0.0
          print(f'Line coverage (src/): {pct:.1f}% (floor >= 80%)')
          sys.exit(0 if pct >= 80.0 else 1)
          EOF

      # Threshold 1.0: measured duplication on src/ is 0.0% (jscpd, min-tokens
      # 50, min-lines 5) — max(1.0, measured + 0.5), so the guard only fires
      # on genuinely new duplication.
      - name: Duplication guard (src/ < 1%)
        run: |
          npx --yes jscpd@5 --min-tokens 50 --min-lines 5 --reporters json \
            --output /tmp/jscpd-ci src/ || true
          python3 - <<'EOF'
          import json, sys
          try:
              with open('/tmp/jscpd-ci/jscpd-report.json') as f:
                  pct = json.load(f)['statistics']['total']['percentage']
          except Exception:
              pct = 0.0
          print(f'Duplication: {pct}% (threshold < 1.0%)')
          sys.exit(0 if float(pct) < 1.0 else 1)
          EOF

  release:
    name: Auto-release (patch bump + tag)
    runs-on: ubuntu-latest
    needs: quality
    # Every push to main gets an IMMEDIATE release with an auto-incremented
    # patch version (0.1.x -> 0.1.y) — npm has no pub.dev-style publish
    # quota, so there is no coalescing window. Release commits are skipped
    # (loop guard); the nothing-pending guard in scripts/auto_release.sh
    # prevents duplicates.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release):')
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      released: ${{ steps.rel.outputs.released }}
      tag: ${{ steps.rel.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version, changelog, tag, push and open GitHub Release
        id: rel
        run: bash scripts/auto_release.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm (trusted publishing / OIDC)
    runs-on: ubuntu-latest
    needs: [quality, release]
    # Chained after a successful in-run release (needs.outputs), or a
    # pushed tag. `always()` is required: the release job is SKIPPED on
    # tag events (its if is main/schedule only), and a skipped need
    # otherwise forces this job to skip regardless of its own if.
    # needs.quality.result gates on real green, not just "not failed".
    if: >-
      always()
      && needs.quality.result == 'success'
      && (needs.release.outputs.released == 'true'
          || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    permissions:
      id-token: write # OIDC — npm verifies the GitHub identity, no secrets
      contents: write # tag path also backfills the GitHub Release page
    steps:
      # The released tag (chained path) or the pushed tag (manual path);
      # package.json at that ref carries the matching version by construction.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package.json version
        run: |
          tag="${{ needs.release.outputs.tag || github.ref_name }}"
          tag="${tag#v}"
          version=$(node -p "require('./package.json').version")
          echo "tag=$tag package.json=$version"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match package.json version $version"
            exit 1
          fi

      # Manual tag pushes skip the release job (its if is main/schedule
      # only), so nothing creates the Release page for them — backfill it
      # here. The chained path already has one from scripts/auto_release.sh.
      - name: Ensure GitHub Release exists for the tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          gh release view "$tag" -R vabhzw17eg2qu4m9-bit/omp_hub_client ||
            gh release create "$tag" -R vabhzw17eg2qu4m9-bit/omp_hub_client \
              --title "$tag" --generate-notes

      # npm requires the FIRST publish of a new package name to be done by
      # the package owner interactively — skip green with the exact bootstrap
      # command until the package exists, then automated publishing takes over.
      - name: First-publish bootstrap guard
        id: bootstrap
        run: |
          if curl -sf https://registry.npmjs.org/omp_hub_client >/dev/null; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Package omp_hub_client is not on the npm registry yet."
            echo "npm requires the first publish of a new package name to be done by the owner:"
            echo "  git clone https://github.com/vabhzw17eg2qu4m9-bit/omp_hub_client && cd omp_hub_client"
            echo "  git checkout ${{ needs.release.outputs.tag || github.ref_name }}"
            echo "  npm ci && npm run build && npm publish --access public"
            echo "Then link the trusted publisher at npmjs.com -> package settings -> publishing"
            echo "so automated OIDC publishing takes over for every later tag."
          fi

      # npm 12 (ships with Node 24) — trusted publishing (OIDC) ready; pinned
      # explicitly so a bundled-npm drift can never break the publish path.
      - name: Ensure npm 12
        if: steps.bootstrap.outputs.skip != 'true'
        run: npm i -g npm@12

      - if: steps.bootstrap.outputs.skip != 'true'
        run: npm ci

      - name: Publish (trusted publishing via OIDC)
        if: steps.bootstrap.outputs.skip != 'true'
        run: npm publish --access public --provenance
